name: 阿里叔叔续期 · 账号4

# ============================================================
# 这个公开库只负责【账号4】：自己的 secrets、自己的代理节点、自己的 cron。
# 代码在私有库（vars.CODE_REPO），运行时 checkout 到 app/ 执行；公开库里没有任何账号代码。
#
# 定时：15 2 * * *（UTC）＝ 北京时间 10:15
# 每个库的 cron 故意错开 25 分钟，避免四个库同一秒去抢同一个站点 / 同一条出口。
#
# ── 需要在【本库】Settings → Secrets and variables → Actions 里配 ──
# Variables:
#   CODE_REPO         = 用户名/alishushu-renew-core        （私有代码库，必填）
#   INSTANCE          = （可选）只续名称或 ID 含该子串的实例，多实例时用
#   RENEW_MONTHS      = （可选）续几个月，默认 1
#   SKIP_IF_DAYS_GT   = （可选）剩余天数大于它就跳过，默认 30（防止一天续两次）
#   MAX_COST          = （可选）报价上限，默认 0（超过就中止，绝不多花钱）
# Secrets:
#   CODE_REPO_TOKEN   = 私有库的细粒度 PAT（Contents: Read and write，要能回写会话状态）
#   ACC_EMAIL         = 账号4 的登录邮箱
#   ACC_PASS          = 账号4 的密码
#   ACC_SEED          = （可选）指纹种子；留空则用邮箱派生，同一账号永远同一指纹
#   PROXY_NODE        = 本库专用的代理出口，例如：
#                          socks5://1.2.3.4:1080                  （socks5 无认证）
#                          socks5://user:pass@1.2.3.4:1080        （socks5 带用户名密码）
#                          hy2://pass@host:443?sni=xx&insecure=1  （hysteria2 / hy2）
#                          vmess://… / vless://… / trojan://… / tuic://… / ss://…
#                        留空 = 直连（站点看到 runner IP，不建议）
#   TG_TOKEN / TG_CHAT = Telegram 通知（四个库用同一个 bot 即可）
# ============================================================

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '演练：只报价、不点确认'
        type: boolean
        default: false
      selftest:
        description: '只跑代理隔离自测（假节点，不碰账号）'
        type: boolean
        default: false
      discover:
        description: '只跑校准（登录后把控制台结构扒下来存 artifact）'
        type: boolean
        default: false
      instance:
        description: '只续这个实例（名称或 ID 含该字符串）'
        required: false

concurrency:
  group: alishushu-acc4
  cancel-in-progress: false

# 会话状态回写到私有库（用 CODE_REPO_TOKEN），本库自身只需要读权限 + 保活要写
permissions:
  contents: write

jobs:
  # ── 0) 代理隔离自测：4 个假节点（socks5 无认证 / socks5 带认证 / hysteria2 / vmess-ws） ──
  proxy-selftest:
    if: ${{ inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检查 CODE_REPO 变量
        run: |
          if [ -z "${{ vars.CODE_REPO }}" ]; then
            echo "::error::没配仓库变量 CODE_REPO（应为 用户名/alishushu-renew-core）"; exit 1
          fi
      - name: 拉取私有代码库
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载 sing-box v1.13.14
        run: |
          mkdir -p /tmp/sb
          curl -fL --retry 3 --connect-timeout 15 -o /tmp/sb/sb.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz
          tar -xzf /tmp/sb/sb.tgz -C /tmp/sb
          chmod +x /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box
          /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box version | head -1
      - name: 跑假节点自测
        working-directory: app
        env:
          SB_BIN: /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box
        run: node scripts/selftest-proxy.mjs

  # ── 1) 主流程：会话复用 → 登录（必要时）→ 续期 → 回写状态 → TG 通知 ──
  renew:
    if: ${{ !inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACC_LABEL: '账号4'
      ACC_EMAIL: ${{ secrets.ACC_EMAIL }}
      ACC_PASS: ${{ secrets.ACC_PASS }}
      ACC_SEED: ${{ secrets.ACC_SEED }}
      STATE_FILE: 'state/acc4.json'
      PROXY_NODE: ${{ secrets.PROXY_NODE }}
      PROXY_SRC: ${{ secrets.PROXY_NODE && 'Secrets.PROXY_NODE' || '未配置（直连）' }}
      INSTANCE: ${{ inputs.instance || vars.INSTANCE }}
      RENEW_MONTHS: ${{ vars.RENEW_MONTHS || '1' }}
      SKIP_IF_DAYS_GT: ${{ vars.SKIP_IF_DAYS_GT || '30' }}
      MAX_COST: ${{ vars.MAX_COST || '0' }}
      DRY: ${{ inputs.dry && '1' || '' }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - name: 配置预检
        env:
          E: ${{ secrets.ACC_EMAIL }}
          P: ${{ secrets.PROXY_NODE }}
        run: |
          echo "账号邮箱已配：${E:+yes}${E:-NO}"
          echo "代理节点长度：${#P}（0 = 直连）"
          echo "状态文件：${{ env.STATE_FILE }}"
          echo "### 账号4 本次：演练=${{ inputs.dry || '否' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 拉取私有代码库
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: 安装浏览器（Chromium）
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: 站点健康检查
        working-directory: app
        run: node scripts/health.mjs

      - name: 启动代理（本库专属出口）
        working-directory: app
        run: bash scripts/setup-proxy.sh

      - name: 校准（手动勾选 discover 才跑）
        if: ${{ inputs.discover }}
        working-directory: app
        run: node scripts/discover.mjs

      - name: 续期
        if: ${{ !inputs.discover }}
        working-directory: app
        run: node scripts/run-account.mjs

      - name: 回写会话/指纹状态到私有库
        if: always()
        working-directory: app
        env:
          CODE_REPO: ${{ vars.CODE_REPO }}
          CODE_REPO_TOKEN: ${{ secrets.CODE_REPO_TOKEN }}
          STATE_LABEL: '账号4'
        run: bash scripts/push-state.sh

      - name: 上传排查产物（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acc4-artifacts
          path: app/artifacts
          retention-days: 3
          if-no-files-found: ignore

      - name: 失败告警
        if: failure()
        working-directory: app
        run: node -e "import('./scripts/tg.mjs').then(m=>m.send('⚠️ 账号4 的续期 job 异常结束，请到 Actions 日志查看')).catch(e=>console.error(e.message))"

  # ── 2) 仓库保活：GitHub 会停用 60 天没活动的仓库的 cron ──
  keepalive:
    needs: [renew]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新时间戳并提交
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > heartbeat.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore(keepalive): heartbeat $(date -u +'%Y-%m-%d')" || exit 0
          git push
